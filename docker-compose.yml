services:
  card-ui:
    build: .
    container_name: card_ui_generator
    ports:
      # Maps host port 8090 (or custom PORT env) to container port 8765
      - "${PORT:-8090}:8765"
    volumes:
      # Persist newly created designs on the host
      - ./designs:/app/designs
      # Persist uploaded image assets on the host
      - ./assets:/app/assets
    restart: unless-stopped
